<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-dot"></div>
            <h3>Nexus Injector</h3>
        </header>

        <div class="drop-zone" id="drop-zone">
            <span class="icon">⬡</span>
            <p>Kéo thả ảnh hoặc <b>Ctrl+V</b></p>
        </div>

        <div class="input-group">
            <input type="text" id="url-input" placeholder="Hoặc dán URL ảnh trực tiếp...">
            <button id="translate-btn">DỊCH</button>
        </div>

        <div class="input-group" style="margin-top: 8px;">
            <select id="prompt-mode" style="width: 100%; padding: 10px; background: rgba(10, 12, 16, 0.8); color: #00e5ff; border: 1px solid #00e5ff; border-radius: 8px; font-family: var(--mono); outline: none; cursor: pointer;">
                <option value="none">Model: Tự Động (Auto)</option>
                <option value="manga">Model: Truyện Tranh (Manga)</option>
                <option value="raw">Model: Thô (Raw)</option>
            </select>
        </div>
        
        <div class="input-group" style="margin-top: 8px;">
            <button id="clear-cache-btn" style="flex: 1; border-color: #f43f5e; color: #f43f5e; background: rgba(244, 63, 94, 0.1);">DỌN CACHE TRÌNH DUYỆT</button>
        </div>
        
        <div class="status-bar">
            <span class="status-dot" id="status-dot"></span>
            <span id="status">Standby Mode</span>
        </div>

        <div style="font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 8px; text-align: center;">
            Phím tắt: [Alt + T] Dịch / [Shift + Di chuột] Kính lúp
        </div>

        <div class="result-container">
            <img id="result-img" style="display:none;">
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
